<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>spotdl</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#tile)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#shine)"/>
  <rect x="25" y="25" width="462" height="462" rx="111" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- sound bars whose lower ends point down, over a base line: music, downloading -->
  <g fill="url(#bars)">
    <rect x="88" y="126" width="36" height="86" rx="18"/>
    <rect x="138" y="104" width="36" height="164" rx="18"/>
    <rect x="188" y="88" width="36" height="236" rx="18"/>
    <rect x="238" y="76" width="36" height="304" rx="18"/>
    <rect x="288" y="92" width="36" height="232" rx="18"/>
    <rect x="338" y="110" width="36" height="158" rx="18"/>
    <rect x="388" y="132" width="36" height="80" rx="18"/>
    <rect x="136" y="410" width="240" height="26" rx="13"/>
  </g>
</svg>
