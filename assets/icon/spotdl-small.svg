<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>spotdl (small sizes)</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#tile)"/>
  <!-- sound bars whose lower ends point down, over a base line: music, downloading -->
  <g fill="url(#bars)">
    <rect x="74" y="118" width="60" height="96" rx="30"/>
    <rect x="150" y="92" width="60" height="198" rx="30"/>
    <rect x="226" y="72" width="60" height="294" rx="30"/>
    <rect x="302" y="92" width="60" height="198" rx="30"/>
    <rect x="378" y="118" width="60" height="96" rx="30"/>
    <rect x="112" y="402" width="288" height="48" rx="24"/>
  </g>
</svg>
