name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Install ffmpeg (format conversion test) and fontconfig (desktop app)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y ffmpeg libfontconfig1-dev
    - name: Install ffmpeg (format conversion test)
      if: runner.os == 'macOS'
      run: brew install ffmpeg
    - name: Install ffmpeg (format conversion test)
      if: runner.os == 'Windows'
      run: choco install ffmpeg -y --no-progress
    - name: Check the Windows installer script parses
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $errors = $null
        [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\install.ps1", [ref]$null, [ref]$errors)
        if ($errors) { $errors | ForEach-Object { $_.ToString() }; exit 1 }
    - name: Check formatting
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Build and test the command line alone
      run: cargo test --no-default-features --verbose
    - name: Check the programs carry their icon, version details and C runtime
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
        foreach ($exe in 'spotdl.exe', 'spotdl-gui.exe') {
          $info = (Get-Item "target\debug\$exe").VersionInfo
          if ($info.FileDescription -ne 'spotdl' -or $info.ProductVersion -ne $version) {
            throw "$exe lacks its resources: $($info | Format-List | Out-String)"
          }
          # it runs without the Visual C++ Redistributable (see .cargo/config.toml)
          if (Select-String -Path "target\debug\$exe" -Pattern 'vcruntime140.dll' -SimpleMatch -Quiet) {
            throw "$exe needs vcruntime140.dll"
          }
        }
    - name: Start the desktop app (this machine has no GPU, so it may need the software renderer)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $config = Join-Path $env:RUNNER_TEMP 'spotdl-config'
        $music = Join-Path $env:RUNNER_TEMP 'spotdl-music'
        $log = Join-Path $env:RUNNER_TEMP 'spotdl-gui.log'
        $env:RUST_LOG = 'spotdl=info,spotdl_gui=info'
        Start-Process target\debug\spotdl-gui.exe -ArgumentList '--config-dir', $config, '-o', $music -RedirectStandardError $log
        Start-Sleep -Seconds 20
        $running = Get-Process spotdl-gui -ErrorAction SilentlyContinue
        Get-Content $log
        $running | Stop-Process -Force
        if (-not $running) { throw 'the desktop app stopped (its log is above)' }
        if (Select-String -Path $log -Pattern 'ran into a problem' -Quiet) { throw 'the desktop app reported a problem' }
    - name: Build for Windows on ARM
      if: runner.os == 'Windows'
      run: |
        rustup target add aarch64-pc-windows-msvc
        cargo build --target aarch64-pc-windows-msvc --verbose

  windows-installer:
    # the installer people run to install spotdl on Windows, on a real Windows machine; the
    # installers (x64 and ARM64) are kept as this run's "windows-installers" artifact
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    env:
      APP_KEY: HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{F8C04EF7-E87E-41A3-B99A-AF43699A8A4A}_is1
    steps:
    - uses: actions/checkout@v4
    - name: Install Inno Setup, which makes the installer
      run: |
        $ErrorActionPreference = 'Stop'
        $setup = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
        Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -OutFile $setup
        if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') {
          throw "the Inno Setup download isn't the expected file"
        }
        $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER' -Wait -PassThru
        if ($p.ExitCode -ne 0) { throw "installing Inno Setup failed (exit code $($p.ExitCode))" }
    - name: Give the PATH an entry with a variable in it and a ';' at the end, which installing must leave alone
      run: |
        $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
        $path = "$path;%USERPROFILE%\spotdl-ci-marker;"
        Set-ItemProperty HKCU:\Environment -Name Path -Value $path -Type ExpandString
        Set-Content -Path (Join-Path $env:RUNNER_TEMP 'path-before.txt') -Value $path -NoNewline
    - name: Build the installer and install
      run: powershell -ExecutionPolicy Bypass -File install.ps1
    - name: Check what was installed
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $env:LOCALAPPDATA 'Programs\spotdl'
        foreach ($file in 'spotdl.exe', 'spotdl-gui.exe', 'LICENSE.txt', 'unins000.exe') {
          if (-not (Test-Path (Join-Path $dir $file))) { throw "$file wasn't installed" }
        }
        & (Join-Path $dir 'spotdl.exe') --version
        if ($LASTEXITCODE -ne 0) { throw 'the installed spotdl.exe failed' }
        $shortcut = Join-Path ([Environment]::GetFolderPath('Programs')) 'spotdl.lnk'
        if (-not (Test-Path $shortcut)) { throw 'no Start menu entry' }
        $link = (New-Object -ComObject WScript.Shell).CreateShortcut($shortcut)
        if ($link.TargetPath -ne (Join-Path $dir 'spotdl-gui.exe')) { throw "the Start menu entry opens $($link.TargetPath)" }
        $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
        $app = Get-ItemProperty $env:APP_KEY
        if ($app.DisplayName -ne 'spotdl' -or $app.DisplayVersion -ne $version) { throw "Settings > Apps lists $($app.DisplayName) $($app.DisplayVersion)" }
        $before = Get-Content (Join-Path $env:RUNNER_TEMP 'path-before.txt') -Raw
        $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
        if ($path -cne "$before$dir;") { throw "the PATH should be the one before plus $dir, but it's $path" }
    - name: Install again over the top (an update), with the desktop app running
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $env:LOCALAPPDATA 'Programs\spotdl'
        Start-Process (Join-Path $dir 'spotdl-gui.exe') -ArgumentList '--config-dir', "$env:RUNNER_TEMP\spotdl-config", '-o', "$env:RUNNER_TEMP\spotdl-music"
        Start-Sleep -Seconds 10
        if (-not (Get-Process spotdl-gui -ErrorAction SilentlyContinue)) { throw "the desktop app didn't start" }
        $took = Measure-Command { powershell -ExecutionPolicy Bypass -File install.ps1 }
        if ($LASTEXITCODE -ne 0) { throw 'updating failed' }
        if (Get-Process spotdl-gui -ErrorAction SilentlyContinue) { throw 'the desktop app is still running' }
        Write-Host "updating took $([int]$took.TotalSeconds) seconds"
        $before = Get-Content (Join-Path $env:RUNNER_TEMP 'path-before.txt') -Raw
        $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
        if ($path -cne "$before$dir;") { throw "updating changed the PATH to $path" }
    - name: Uninstall, with the desktop app running
      run: |
        $ErrorActionPreference = 'Stop'
        Start-Process (Join-Path $env:LOCALAPPDATA 'Programs\spotdl\spotdl-gui.exe') -ArgumentList '--config-dir', "$env:RUNNER_TEMP\spotdl-config", '-o', "$env:RUNNER_TEMP\spotdl-music"
        Start-Sleep -Seconds 10
        powershell -ExecutionPolicy Bypass -File install.ps1 -Uninstall
        if ($LASTEXITCODE -ne 0) { throw 'uninstalling failed' }
    - name: Check it's all gone, and the PATH is as it was
      run: |
        $ErrorActionPreference = 'Stop'
        $dir = Join-Path $env:LOCALAPPDATA 'Programs\spotdl'
        if (Test-Path $dir) { throw "$dir is still there" }
        if (Get-Process spotdl-gui -ErrorAction SilentlyContinue) { throw 'the desktop app is still running' }
        if (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) 'spotdl.lnk')) { throw 'the Start menu entry is still there' }
        if (Test-Path $env:APP_KEY) { throw 'Settings > Apps still lists spotdl' }
        $before = Get-Content (Join-Path $env:RUNNER_TEMP 'path-before.txt') -Raw
        $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames')
        if ($path -cne $before) { throw "the PATH should be back to $before, but it's $path" }
    - name: Build the installer for Windows on ARM
      run: |
        rustup target add aarch64-pc-windows-msvc
        powershell -ExecutionPolicy Bypass -File install.ps1 -BuildOnly -Target aarch64-pc-windows-msvc
        if ($LASTEXITCODE -ne 0) { throw 'building the ARM installer failed' }
    - uses: actions/upload-artifact@v4
      with:
        name: windows-installers
        path: target/installer/*.exe
        if-no-files-found: error
